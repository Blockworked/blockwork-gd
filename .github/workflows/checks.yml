name: Build checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS universal
            os: macos-latest
            target: MacOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build embedded engine
        id: engine
        uses: ./.github/actions/embedded-engine
      - name: Build mod
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc
        with:
          sdk: given
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          target: ${{ matrix.target }}
          combine: true
          configure-args: >-
            -DBLOCKWORK_FFI_LIB="${{ steps.engine.outputs.ffi-lib }}"
            -DBLOCKWORK_FFI_INCLUDE_DIR="${{ steps.engine.outputs.ffi-include }}"

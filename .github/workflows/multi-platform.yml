name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0 or v1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  set-version:
    name: Set mod version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '${{ inputs.version }}' is not a valid x.y.z version"
            exit 1
          fi
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

  bump-version:
    name: Bump mod.json version
    runs-on: ubuntu-latest
    needs: ['set-version']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Update mod.json
        run: |
          jq --arg v "${{ needs.set-version.outputs.version }}" '.version = $v' mod.json > mod.json.tmp
          mv mod.json.tmp mod.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mod.json
          git diff --cached --quiet && exit 0
          git commit -m "Bump version to ${{ needs.set-version.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}

  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    needs: ['set-version', 'bump-version']
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

          - name: macOS
            os: macos-latest
            target: MacOS

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build embedded engine
        id: engine
        uses: ./.github/actions/embedded-engine

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@a0f7676e6fcd1a584f6d0c1c800239008412defc
        with:
          combine: true
          sdk: given
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          target: ${{ matrix.config.target }}
          configure-args: >-
            -DBLOCKWORK_FFI_LIB="${{ steps.engine.outputs.ffi-lib }}"
            -DBLOCKWORK_FFI_INCLUDE_DIR="${{ steps.engine.outputs.ffi-include }}"

  release:
    name: Combine and release
    runs-on: ubuntu-latest
    needs: ['set-version', 'build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.set-version.outputs.version }}
          name: ${{ needs.set-version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.build-output }}/*
